<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>probe2</title>
<style>body{font:13px/1.6 monospace;padding:10px}div{margin:2px 0}</style>
</head>
<body>
<div id="log">start</div>
<script>
function L(t){ var d=document.createElement("div"); d.textContent=t; document.getElementById("log").appendChild(d); }
var KEY="92f7745dba3d8592d9a5d21691c38abd", SEC="74bc3446ff478240796f2aaa0b8862ba";
window._AMapSecurityConfig={securityJsCode:SEC};
var s=document.createElement("script");
s.src="https://webapi.amap.com/maps?v=2.0&key="+KEY+"&plugin=AMap.Driving,AMap.Geocoder";
s.onload=function(){ L("sdk ok v="+(window.AMap&&AMap.version)); run(); };
s.onerror=function(){ L("sdk load error"); };
document.head.appendChild(s);

var P=[
 ["dalian","121.524117,38.877589"],
 ["jingxian","116.269345,37.670594"],
 ["guangzhou","113.257331,23.149243"],
 ["hz","120.264,30.185"],
 ["yw","120.075,29.306"]
];
function pt(s){ var a=s.split(","); return new AMap.LngLat(parseFloat(a[0]),parseFloat(a[1])); }
function drive(a,b,tag,cb){
  var d=new AMap.Driving({policy:AMap.DrivingPolicy.LEAST_TIME});
  var t0=Date.now();
  d.search(pt(a),pt(b),function(st,res){
    var r=res&&res.routes&&res.routes[0];
    L("drive "+tag+" st="+st+" ms="+(Date.now()-t0)+" info="+(res&&res.info||"")+" code="+(res&&res.infocode||"")+
      " dist="+(r?r.distance:"-")+" tolls="+(r?r.tolls:"-"));
    if(cb) cb();
  });
}
function run(){
  var i=0, pairs=[
    ["dalian","jingxian","大连->景县 空驶"],
    ["jingxian","guangzhou","景县->广州 载货"],
    ["hz","yw","杭州->义乌 对照"]
  ];
  (function next(){
    if(i>=pairs.length){ L("ALL DONE"); return; }
    var q=pairs[i++];
    var m={}; P.forEach(function(x){m[x[0]]=x[1];});
    drive(m[q[0]],m[q[1]],q[2],next);
  })();
}
</script>
</body></html>
