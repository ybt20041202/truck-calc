<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>probe</title>
<style>body{font:13px/1.6 monospace;padding:10px}div{margin:2px 0}</style>
</head>
<body>
<div id="log">start</div>
<script>
function L(t){ var d=document.createElement("div"); d.textContent=t; document.getElementById("log").appendChild(d); }
var KEY="92f7745dba3d8592d9a5d21691c38abd", SEC="74bc3446ff478240796f2aaa0b8862ba";
window._AMapSecurityConfig={securityJsCode:SEC};
var s=document.createElement("script");
s.src="https://webapi.amap.com/maps?v=2.0&key="+KEY+"&plugin=AMap.Driving,AMap.Geocoder,AMap.AutoComplete,AMap.Geolocation";
s.onload=function(){ L("sdk ok v="+(window.AMap&&AMap.version)); run(); };
s.onerror=function(){ L("sdk load error"); };
document.head.appendChild(s);

var names=["辽宁省大连市甘井子区凌水街道","景县董子公园","广州站","杭州市萧山区","义乌国际商贸城"];
function geocodeAll(cb){
  var g=new AMap.Geocoder(), out={}, i=0;
  (function next(){
    if(i>=names.length){ cb(out); return; }
    var n=names[i++];
    g.getLocation(n,function(st,res){
      var p=res&&res.geocodes&&res.geocodes[0];
      out[n]= (st==="complete"&&p)?p.location:null;
      L("geocode ["+n+"] st="+st+" info="+(res&&res.info||"")+" -> "+(out[n]?out[n].lng+","+out[n].lat:"NULL"));
      next();
    });
  })();
}
function drive(a,b,tag,cb){
  var d=new AMap.Driving({policy:AMap.DrivingPolicy.LEAST_TIME});
  d.search(a,b,function(st,res){
    var r=res&&res.routes&&res.routes[0];
    L("drive "+tag+" st="+st+" info="+(res&&res.info||"")+" infocode="+(res&&res.infocode||"")+
      " dist="+(r?r.distance:"-")+" time="+(r?r.time:"-")+" tolls="+(r?r.tolls:"-"));
    if(cb) cb(r);
  });
}
function run(){
  geocodeAll(function(p){
    var ar=[p[names[0]],p[names[1]]];
    L("--- 大连 -> 景县 (空驶段) ---");
    drive(p[names[0]],p[names[1]],"大连->景县",function(){
      L("--- 景县 -> 广州站 (载货段) ---");
      drive(p[names[1]],p[names[2]],"景县->广州",function(){
        L("--- control 杭州 -> 义乌 ---");
        drive(p[names[3]],p[names[4]],"杭州->义乌",function(){ L("ALL DONE"); });
      });
    });
  });
}
</script>
</body></html>
