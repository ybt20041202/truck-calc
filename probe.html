<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>probe3</title>
<style>body{font:13px/1.6 monospace;padding:10px}#m{height:200px;background:#e6edf5}div{margin:2px 0}</style>
</head>
<body>
<div id="m"></div>
<div id="log">start</div>
<script>
function L(t){ var d=document.createElement("div"); d.textContent=t; document.getElementById("log").appendChild(d); }
var KEY="92f7745dba3d8592d9a5d21691c38abd", SEC="74bc3446ff478240796f2aaa0b8862ba";
window._AMapSecurityConfig={securityJsCode:SEC};
var s=document.createElement("script");
s.src="https://webapi.amap.com/maps?v=2.0&key="+KEY+"&plugin=AMap.Driving,AMap.Geocoder";
s.onload=function(){ L("sdk ok"); run(); };
s.onerror=function(){ L("sdk load error"); };
document.head.appendChild(s);

function run(){
  var map = new AMap.Map("m", { zoom: 10, viewMode: "2D" });
  map.resize();
  var driving = new AMap.Driving({ map: map, policy: AMap.DrivingPolicy.LEAST_TIME });
  var g = new AMap.Geocoder();
  g.getLocation("辽宁省大连市甘井子区凌水街道", function(st,res){
    var a = st==="complete" && res.geocodes && res.geocodes[0] && res.geocodes[0].location;
    L("geo now st="+st+" -> "+(a?a.lng+","+a.lat:"NULL"));
    g.getLocation("景县董子公园", function(st2,res2){
      var b = st2==="complete" && res2.geocodes && res2.geocodes[0] && res2.geocodes[0].location;
      L("geo pick st="+st2+" -> "+(b?b.lng+","+b.lat:"NULL"));
      var t0=Date.now();
      driving.search(a, b, function(s1,r1){
        var r = r1 && r1.routes && r1.routes[0];
        L("drive(map bound) st="+s1+" ms="+(Date.now()-t0)+" info="+(r1&&r1.info||"")+" code="+(r1&&r1.infocode||"")+
          " dist="+(r?r.distance:"-")+" tolls="+(r?r.tolls:"-"));
        var driving2 = new AMap.Driving({ policy: AMap.DrivingPolicy.LEAST_TIME });
        var t1=Date.now();
        driving2.search(a, b, function(s2,r2){
          var q = r2 && r2.routes && r2.routes[0];
          L("drive(no map) st="+s2+" ms="+(Date.now()-t1)+" info="+(r2&&r2.info||"")+" dist="+(q?q.distance:"-"));
          L("ALL DONE");
        });
      });
    });
  });
}
</script>
</body></html>
